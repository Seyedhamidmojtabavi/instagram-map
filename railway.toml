[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
# Serves the site and runs the Instagram sync on a schedule in one service, so
# both share the volume that holds the atlas data. Attach a volume (any mount
# path) to keep that data across deploys.
startCommand = "npm run start"
healthcheckPath = "/api/status"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
